# Included in every location block (nginx does not inherit add_header across levels).
# The bundle loads no external scripts, fonts or images, so a strict CSP is safe;
# 'unsafe-inline' for styles is needed by the chart library's inline style attributes.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
