x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: financemaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financemaster"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Settl's own LiteLLM proxy. It is part of the "bundled-litellm" profile, which
  # .env enables by default (COMPOSE_PROFILES=bundled-litellm). Already running
  # LiteLLM elsewhere? Leave COMPOSE_PROFILES empty so this container never starts,
  # and either set LITELLM_URL / LITELLM_API_KEY below or pick "A LiteLLM I already
  # run" under Settings -> AI -> Proxy in the app.
  litellm:
    profiles: ["bundled-litellm"]
    # Pin a release tag (e.g. main-v1.x.y) for reproducible deployments.
    image: ghcr.io/berriai/litellm:main-latest
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-change-me}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    # Lets the backend reach a LiteLLM running on the host as host.docker.internal
    # (Docker Desktop provides the name; this line adds it on Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/financemaster
      # The bundled proxy above, and (optionally) one you already run.
      - BUNDLED_LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-change-me}
      - LITELLM_URL=${LITELLM_URL:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - CONFIG_PATH=/app/config/config.yaml
      - UPLOAD_DIR=/app/uploads
      - KEEP_UPLOADED_FILES=${KEEP_UPLOADED_FILES:-false}
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      - PRIMARY_PASSWORD=${PRIMARY_PASSWORD:?set PRIMARY_PASSWORD in .env}
      - SECONDARY_PASSWORD=${SECONDARY_PASSWORD:?set SECONDARY_PASSWORD in .env}
      - LLM_PROVIDER=${LLM_PROVIDER:-litellm}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-litellm}
      # Settings -> System: compare the running code with GitHub and talk to the updater.
      - UPDATER_URL=http://updater:9000
      - UPDATE_CHECK=${UPDATE_CHECK:-true}
      - UPDATE_REPO=${UPDATE_REPO:-mattiaborsoi/personal-finance}
      - UPDATE_BRANCH=${UPDATE_BRANCH:-main}
      # Settings -> System -> Backups: nightly pg_dump files, kept in the "backups" volume.
      - BACKUP_DIR=/app/backups
      - BACKUPS_ENABLED=${BACKUPS_ENABLED:-true}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./config.yaml:/app/config/config.yaml:ro
      - ./uploads:/app/uploads
      # A named volume, so it works wherever the repository lives. To keep the dumps in a
      # host folder instead, bind one over it in docker-compose.override.yml.
      - backups:/app/backups
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: always
    logging: *default-logging
    depends_on:
      backend:
        condition: service_started
      # Only so that every `docker compose up -d --build backend frontend` (what the
      # updater runs) also runs the clean-up below; the frontend never waits for it.
      maintenance:
        condition: service_started
    ports:
      # Bind to a specific LAN / VPN address instead of all interfaces if the host
      # has a public interface, e.g. "192.168.1.10:80:80".
      - "80:80"

  # Optional self-update sidecar (Settings -> System -> "Update now"). It pulls the
  # branch from GitHub and rebuilds the app containers through the host's Docker
  # socket, which is root-equivalent on the host: remove this service if you would
  # rather update by hand with `git pull && docker compose up -d --build`.
  # The repository is mounted at its host path so Compose's relative bind mounts
  # still resolve when the updater runs `docker compose` on your behalf.
  updater:
    build: ./updater
    restart: always
    logging: *default-logging
    environment:
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      - REPO_DIR=${PWD:?run docker compose from a shell inside the repository}
      - UPDATE_BRANCH=${UPDATE_BRANCH:-main}
      - COMPOSE_SERVICES=backend frontend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD:?run docker compose from a shell inside the repository}:${PWD}

  # One-shot clean-up, started alongside the frontend on every update: removes
  # dangling (untagged) images that carry the com.settl.project=settl label, i.e.
  # the previous builds of Settl's own images, and exits. Images of other projects
  # on the host, tagged images, images in use and the build cache are never touched.
  # It needs the Docker socket but no repository mount.
  maintenance:
    build:
      context: ./updater
      labels:
        com.settl.service: maintenance
    restart: "no"
    logging: *default-logging
    command: ["python", "maintenance.py"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  backups:
